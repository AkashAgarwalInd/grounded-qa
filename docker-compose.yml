services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - "./qdrant_storage:/qdrant/storage"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      PYTHONPATH: /srv
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy